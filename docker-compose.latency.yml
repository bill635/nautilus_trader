version: '3.8'

services:
  binance-latency-test:
    build:
      context: .
      dockerfile: Dockerfile.latency-test
    container_name: nautilus-binance-latency-test
    volumes:
      # 挂载报告输出目录
      - ./reports:/app/reports
      # 挂载源码目录（用于开发调试）
      - ./docker:/app/docker:ro
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - BUILD_MODE=release
    networks:
      - nautilus-latency-network
    restart: "no"
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # 可选：数据分析服务
  latency-analyzer:
    image: python:3.11-slim
    container_name: nautilus-latency-analyzer
    volumes:
      - ./reports:/app/reports
      - ./analysis:/app/analysis
    working_dir: /app
    command: |
      bash -c "
        pip install pandas matplotlib numpy &&
        echo '分析服务已准备就绪' &&
        tail -f /dev/null
      "
    networks:
      - nautilus-latency-network
    depends_on:
      - binance-latency-test

networks:
  nautilus-latency-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  latency-reports:
    driver: local
